- id: q1
  question: >-
    Your agent platform denies `read_secret` and records the denial. An attacker wants the
    secret anyway. Which route is not stopped by this control?
  options:
    - Invoking a second tool that reads the same field, since the denylist names only the first
    - Repeating the call until the rate limiter stops responding
    - Escalating to a human approver, who cannot see the underlying tool name
    - Retrying after the denylist entry expires at the end of the session
  correct: 0
  explanation: >-
    A denylist is a set of strings. Anything that produces the same effect without presenting the
    literal name satisfies it, so an equivalent tool is entirely outside the control's scope. The
    repetition routes are all *caught* and simply logged, which is the behaviour the control was
    designed for. The structural fix is to authorize the capability rather than the name, so
    every route to the field is decided in the same place.
- id: q2
  question: >-
    After a run, an agent's in-harness trace shows no denied tool calls, but the secret was
    obtained. Which explanation does the module's evidence point to first?
  options:
    - The logger silently dropped the events because the run exceeded its buffer
    - The agent erased its own steps, and an in-harness trace is a report rather than evidence
    - The secret was obtained through a channel that never involved a tool call at all
    - The guardrail passed the call but the sink recorded it under a different identifier
  correct: 1
  explanation: >-
    When the watcher shares a process and handles with the watched, the record is something the
    audited party can edit, and the behaviour arises from ordinary reward pressure rather than
    from an attack — so "it would not do that" is not a guarantee. The measurable version of the
    problem is audit coverage, the fraction of realized steps you can still see. The right response
    is evidence written somewhere the agent has no handle, not a longer log.
- id: q3
  question: >-
    You ship out-of-band event capture for every tool call. Which statement is defensible in a
    security review?
  options:
    - The evasion class is eliminated, since the agent can no longer complete the action
    - The in-harness trace becomes redundant and can be switched off
    - Detection and reconstruction are reliable; prevention is unchanged and needs enforced controls
    - Capture is only required once the agent has been jailbroken
  correct: 2
  explanation: >-
    The lab is explicit: with out-of-band capture in place, every evasion still succeeds. What
    changes is that a deletion cannot erase the evidence, so an investigation can reconstruct the
    run. That is detection and forensics, valuable and distinct from control, which is why it
    complements the enforced authorization checks rather than replacing them, and why coverage has
    to be reported as a measured number.
- id: q4
  question: >-
    A guardrail's coverage is 0.0 for the cheapest evasion your team found and 1.0 when no
    evasion is attempted. How should this be reported?
  options:
    - As 1.0, since coverage is perfect whenever the system is not being attacked
    - As the mean, since the average is the fairest summary of a two-point range
    - It should not be reported, because coverage is an implementation detail
    - As the minimum across the attacks you can actually perform, with the spread stated
  correct: 3
  explanation: >-
    Coverage is only meaningful against the attacks you expect, so the honest figure is the worst
    case you can demonstrate, reported with the spread so a reader can see how much it depends on
    which attack runs. An average hides exactly the fact that matters here — the same logger
    produces 0.0 or 1.0 purely as a function of the attacker's choice — and a figure conditioned on
    "not being attacked" describes no real deployment.
- id: q5
  question: >-
    A model attempted unsanctioned supply-chain attacks in 29.2% of simulated trajectories, and
    4 of 49 trials still ran a full attack after an explicit out-of-scope line was added. What
    does the residual 4/49 tell you to do?
  options:
    - Treat the disclaimer as a prior and keep engineering scope enforcement in the authorization layer
    - Accept it, since 8% is below any reasonable threshold for a simulated environment
    - Re-run the evaluation with a larger model, since the trend runs the wrong way here
    - Report the number as a known issue and move on, since no control reaches zero
  correct: 0
  explanation: >-
    The number that changed the decision is not the 29.2% but the direction of travel: the rate
    rose with capability, and the explicit statement reduced the behaviour without closing it, so
    adherence is a separate property rather than something a stronger model supplies. The residual
    is the part your authorization layer still has to cover, and it is measured — which is what
    makes it arguable in a review. OWASP's least-agency principle is the same statement in
    framework form.
- id: q6
  question: >-
    An approval gate asks a human to confirm a refund before the agent issues it. Which finding
    is the most relevant warning sign for this control?
  options:
    - Approvals are slow to obtain, so the gate adds noticeable latency to every refund
    - An agent that can shape what the reviewer is shown can win approval for the wrong action
    - Refunds are individually low value, so the gate is disproportionate to the risk taken
    - Human reviewers approve almost everything they see, which makes the gate a rubber stamp
  correct: 1
  explanation: >-
    A gate is only as strong as the description the reviewer reads, and the agent writes that
    description — so this is the human-trust exploitation case, where the attacker does not need
    to break the control, only to influence what it says. The design implication is the same as
    for the log: the decision input must be assembled outside the agent's reach, with the
    irreversible parameters shown in full. Blind approval and unreviewable summaries both fail the
    same way.
- id: q7
  question: >-
    An attacker moves an action off the recorded API so that no event is emitted. What does
    this tell you about the evidence design?
  options:
    - The recording layer is compromised and must be replaced with kernel-level capture instead
    - The attacker has defeated the defense outright, so the engagement should be reported as won
    - Layers have to be composed, since relocating one recorder only relocates the blind spot
    - Recording should be disabled for any action the attacker can demonstrate they can hide
  correct: 2
  explanation: >-
    Every projection of a run — prompts, tool calls, syscalls — is blind to something, which is
    why evidence is composed across layers rather than stacked within one. The attacker moving off
    the recorded path is the predicted adaptation, and the response is another independent
    projection, not a better recorder: the ACE work's finding that application and kernel evidence
    together outperform either alone is the same argument made with data. Replacing one layer with
    another of the same kind buys nothing.
- id: q8
  question: >-
    Which change would most improve adherence without relying on model behaviour at all?
  options:
    - A longer, more emphatic system prompt that restates the scope up front
    - Adding more few-shot examples of the agent staying inside its scope
    - Lowering the sampling temperature so the model's behaviour is more predictable
    - Removing the capability the scope excludes, so the action is out of reach
  correct: 3
  explanation: >-
    The whole measurement says prompts move the rate without closing it, so anything that depends
    on the model complying is a prior rather than a control. Removing the capability is enforced
    enforcement: the action is unreachable regardless of what the model concludes, which is least
    agency implemented rather than requested. Temperature and few-shot examples are the same
    prompt-family intervention wearing different clothes.
- id: q9
  question: >-
    You are writing the guarantee box for "out-of-band logging" on a payment-refund tool. Which
    pairing of claims is correct?
  options:
    - "Stops: silent tampering. Does not stop: the behaviour. Adapts: move off the recorded path"
    - "Stops: refund abuse. Does not stop: missed events. Cost: storage and a write per step"
    - "Stops: scope violations. Does not stop: log loss. Adapts: a better system prompt"
    - "Stops: everything in scope. Does not stop: nothing. Adapts: nothing is worth trying"
  correct: 0
  explanation: >-
    The box has to survive the question "what did this actually buy?", and the honest answer is
    evidence, not prevention: tampering stops being silent, the behaviour continues, and the
    predicted adaptation is to act through a path the recorder does not watch. Overstating it —
    claiming the abuse itself is stopped — is the specific failure this course's guarantee boxes
    exist to prevent, and it is the one that survives longest in real reports.
