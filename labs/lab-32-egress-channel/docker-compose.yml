# Lab 32 — reproducible run in an isolated container with NO network egress.
# `docker compose up` runs the egress-covert-channel purple cycle. Stdlib only; needs no internet.
services:
  lab32:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none          # no egress — the whole point is demonstrated in-process
    volumes:
      - ../../:/course:ro        # mount the repo read-only
    command: ["python", "labs/lab-32-egress-channel/attack.py"]
