# Lab 37 — reproducible run in an isolated container with NO network egress.
# `docker compose up` runs the detector-evaluation purple cycle. Stdlib only; needs no internet.
services:
  lab37:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none          # no egress — detectors only classify in-process strings
    volumes:
      - ../../:/course:ro        # mount the repo read-only
    command: ["python", "labs/lab-37-injection-detector-eval/evaluate.py"]
