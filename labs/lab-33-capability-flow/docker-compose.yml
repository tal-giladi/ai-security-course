# Lab 33 — reproducible run in an isolated container with NO network egress.
# `docker compose up` runs the plan-isolation / capability / branch-steering purple cycle.
# Stdlib only; needs no internet.
services:
  lab33:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none          # no egress — everything is simulated in-process
    volumes:
      - ../../:/course:ro        # mount the repo read-only
    command: ["python", "labs/lab-33-capability-flow/attack.py"]
