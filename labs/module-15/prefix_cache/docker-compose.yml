# Lab 15.2 — reproducible run in an isolated container with NO network egress.
# Stdlib only; needs no internet.
services:
  lab15-prefix-cache:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none
    volumes:
      - ../../../:/course:ro
    command: ["python", "labs/module-15/prefix_cache/pc_evaluate.py"]
