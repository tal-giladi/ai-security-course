# Lab 23.2 — reproducible run in an isolated container with NO network egress.
# Stdlib only; needs no internet.
services:
  lab23-watermark:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none
    volumes:
      - ../../../:/course:ro
    command: ["python", "labs/module-23/watermark/wm_evaluate.py"]
