# Lab 05 — reproducible run, no network egress. The in-process fake sink means the attack is
# fully demonstrated offline; network_mode: none enforces the safety model.
services:
  lab05:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none
    volumes:
      - ../../:/course:ro
    command: ["python", "labs/lab-05/attack.py"]
