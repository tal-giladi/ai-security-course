# Lab 35 — reproducible run in an isolated container with NO network egress.
# `docker compose up` runs the ATT&CK v20 AI-Enabled Exfiltration purple cycle. Stdlib only.
services:
  lab35:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none          # no egress — telemetry is synthetic and in-process
    volumes:
      - ../../:/course:ro        # mount the repo read-only
    command: ["python", "labs/lab-35-attack-ai-detection/attack.py"]
