# Lab 26 — reproducible run in an isolated container with NO network egress.
# `docker compose up` prints the hidden-context leak matrix. Stdlib only; needs no internet.
services:
  lab26:
    image: python:3.12-slim
    working_dir: /course
    network_mode: none          # no egress
    volumes:
      - ../../:/course:ro        # mount the repo read-only
    command: ["python", "labs/lab-26-hidden-context/attack.py"]
