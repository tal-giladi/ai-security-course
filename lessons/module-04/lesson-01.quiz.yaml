  question: Which set of one-line definitions for direct injection, indirect injection, and jailbreak is correct?
  options:
    - "Direct: via retrieved docs. Indirect: attacker's own input. Jailbreak: stealing the system prompt"
    - "Direct: defeats safety training. Indirect: via tool output. Jailbreak: attacker's own input"
    - "Direct: attacker's own input overrides instructions. Indirect: via content the model reads. Jailbreak: defeats safety training"
    - "Direct: via emails. Indirect: via web pages. Jailbreak: any injection that succeeds"
  correct: 2
