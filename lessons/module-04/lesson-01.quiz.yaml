  question: Why report a Wilson interval on ASR instead of just the point estimate?
  options:
    - ASR from finite $N$ near 0 or 1 needs a calibrated range to tell real differences from noise
    - The Wilson interval is always narrower, so defenses look stronger
    - A point estimate cannot be computed when $N$ is below 100
    - Wilson intervals remove the need to run more trials when results overlap
