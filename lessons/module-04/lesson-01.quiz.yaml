  question: Why can base64-encoding a payload succeed where the plaintext fails?
  options:
    - Encoding raises the instruction's authority to that of the system prompt
    - Encoding moves it outside what safety training covered, while decoding still works
    - Encoding hides the payload from the model, which follows it unknowingly
    - Encoding makes the payload shorter, so it fits under the context limit
