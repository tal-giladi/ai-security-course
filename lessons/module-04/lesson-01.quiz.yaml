  question: The output scrubber holds under a fully jailbroken model, yet is not a complete fix. Why?
  options:
    - It is only a system-prompt rule, so a jailbroken model can talk past it
    - It slows responses too much to run on every message in production
    - It blocks every form of the secret, but only for the first turn
