- source: 68856b732c3d
  question: After moving the credential to the executor, what is the attacker's best next move, and which control addresses it?
  options:
    - Extract the credential from logs; addressed by output filtering
    - Steer the model to call `refund_api`; least privilege, per-call authz, approval
