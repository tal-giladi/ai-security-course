- id: q1
  question: >-
    Which is a correct definition of indirect prompt injection together with its valid delivery channels?
  options:
    - >-
      The attacker types the payload into chat; channels: user message, system prompt, API key
    - >-
      Instructions hidden in data the model consumes; channels: retrieved docs, web pages, tool results
    - >-
      A model trained on poisoned data; channels: pretraining corpus, fine-tuning set, RLHF labels
    - >-
      Stolen credentials reused against the API; channels: logs, config files, env variables
  correct: 1
  explanation: >-
    Indirect injection is defined by the carrier rather than by the trick used — the text arrives in
    data the model reads, so the attacker never speaks to the model and never needs an account.
    Every channel in that list is the same bug, untrusted text reaching the single instruction
    stream, which is why a document, a web page and a tool result are interchangeable in a threat
    model. Poisoning the training data is a different bug: it changes the weights instead of one
    request's context.
- id: q2
  question: >-
    Why does an indirect payload usually need more strength to land than the same payload sent directly?
  options:
    - It arrives in a lower-priority role with a more negative bias $\beta$, so it starts lower
    - It is truncated by the retriever, so only part of the payload ever reaches the model
    - It must also bypass the tokenizer, which strips imperative verbs from the text
    - It arrives in the system role, where the guard $G$ the attacker must beat is largest
  correct: 0
  explanation: >-
    The follow-probability is $\sigma(s(I) + \beta_{\text{retrieved}} - G)$ and
    $\beta_{\text{retrieved}}$ sits below the user role, so a strength that leaks through chat can
    fail through a document. The handicap raises the attacker's effort rather than the ceiling:
    because the bias is finite, authority framing, a forged role block or an encoding that shrinks
    $G$ still clears the threshold. That is why the lab sees a weak retrieved payload fail and a
    framed one succeed.
- id: q3
  question: >-
    Why is an egress allowlist a stronger defense against this attack than provenance markers or output scrubbing?
  options:
    - It stops the model from ever reading the injected document in the first place
    - It makes the model less likely to obey injections by marking their source as untrusted
    - It detects every encoding of the secret before the reply is ever sent to the user
    - It drives $P(\text{egress reaches attacker})$ to near zero in code, even if the injection is obeyed
  correct: 3
  explanation: >-
    Exfiltration is a product, $P(\text{obeyed}) \times P(\text{egress reaches attacker})$, and the
    allowlist attacks the second factor in code rather than the first in a prompt. Zeroing one
    factor zeroes the product even at perfect obedience, which is the quantitative version of "you
    cannot reliably stop persuasion, only damage". Provenance markers and scrubbing shrink only the
    first factor, so a strong enough payload or a different byte encoding of the secret still wins.
- id: q4
  question: >-
    In the Lab-05 chain, which assignment of confused-deputy roles is correct?
  options:
    - >-
      Attacker: the bot. Deputy: the user. Misused privilege: the retrieval index
    - >-
      Attacker: the user. Deputy: the retriever. Misused privilege: the system prompt
    - >-
      Attacker: plants text only. Deputy: the bot. Misused privilege: its renderer and egress
    - >-
      Attacker: holds the secret. Deputy: the renderer. Misused privilege: the user's session
  correct: 2
  explanation: >-
    The attacker contributes only text: they never held the canary and never held an egress
    capability, so they cannot be the privilege holder in a confused-deputy chain. The deputy is the
    bot, because it is the component that holds the secret and can cause an outbound fetch — that is
    what makes the renderer's markdown image the actual exfiltration path. The remedy follows the
    role rather than the model's manners, which is why the fix is to cut what the deputy can reach.