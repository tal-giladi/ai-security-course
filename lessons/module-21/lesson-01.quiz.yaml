- id: q1
  question: >-
    Why is a coding agent the worst-case agent scenario in this course?
  options:
    - It uses larger models, which are easier to jailbreak
    - It only ever reads trusted code, so defenses are usually turned off
    - Attacker-controlled repository content meets a shell and the software supply chain
    - It runs offline, so no egress control can be applied to it
  correct: 2
  explanation: >-
    Three of the course's worst surfaces arrive at once: untrusted text the agent must read to do
    its job, a capability that turns any obeyed instruction into arbitrary code execution, and an
    install or build step that runs repository code before the agent reasons at all. Remove the
    shell and this becomes an ordinary agent problem; keep it and every earlier lesson applies at
    once.
- id: q2
  question: >-
    What is dependency confusion, and how do you defeat it?
  options:
    - A higher-versioned public package overrides your internal one; pin to a trusted registry with integrity hashes
    - Two internal packages share a name; defeat it by renaming one in the registry
    - A package name contains a typo; defeat it with spell-checking in the resolver
    - A dependency is outdated; defeat it by always installing the newest public version
  correct: 0
  explanation: >-
    The resolver picks the highest version it can find across the sources it is configured with, so
    publishing a `9.9.9` on a public registry beats an internal `1.2.0`. Pinning with a lockfile
    that names the trusted registry and the integrity hash makes the choice a constant the attacker
    cannot raise, which is a deterministic fix rather than a probabilistic one. A rename or a
    spell-check does not address version precedence.
- id: q3
  question: >-
    Why prefer sandboxing the shell over a command allowlist?
  options:
    - Allowlists are structural, but they slow the agent down too much
    - Sandboxes detect malicious commands before they are run
    - Sandboxing lets the agent keep its secrets and network access safely
    - Allowlists can be evaded by chaining; a no-egress, no-secrets sandbox holds regardless
  correct: 3
  explanation: >-
    An allowlist decides from the command string, so shell metacharacters or a chained command can
    slip past it while still running under the same privilege. A sandbox with no network and no
    secrets in the environment makes the exfiltration hop structurally empty: the command may run
    and still have nothing to send and nowhere to send it. That holds no matter what the command
    text looks like.
- id: q4
  question: >-
    A team pins every dependency and verifies hashes, then discovers one pinned package was
    malicious from the moment it was first published. Which control would have caught this, and
    which would not?
  options:
    - Hash verification, because the hash changed after approval
    - Neither, since a substituted artifact is the only thing verification detects
    - Pinning, because the attacker would need a higher version number
    - Behavioral vetting, not pinning or hash verification
  correct: 3
  explanation: >-
    The artifact never changed after you approved it, so the hash matches and the version is pinned;
    verification proves "this is exactly the artifact the publisher signed", not "this artifact is
    safe". The only control that reaches the behavior is vetting — probe for triggers and evaluate
    on your own held-out data, the lesson's backdoor material. This is the residual risk the
    guarantee box names, and why verification is paired rather than used alone.
