  options:
    - Each extra stage lowers overall compromise odds, but raises latency
    - Agents share one context window, so only the first stage can be attacked
    - Each stage is another chance to obey an injection, and edges are unmarked trust boundaries
    - Agents always run with admin rights, unlike single-model apps
