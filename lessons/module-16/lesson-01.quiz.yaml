  question: What is excessive agency, and how do you measure it?
  options:
    - An agent that runs too long; measure it by wall-clock time per task
    - An agent that asks the user too often; measure it by approval prompts
    - An agent able to do more than the task needs; measure its reachable-action set
    - An agent with too many input channels; measure it by the number of documents read
