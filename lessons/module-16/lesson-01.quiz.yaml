  question: Why is the agent a confused deputy, and why doesn't a system prompt fix it?
  options:
    - The attacker steals the agent's credentials; the prompt cannot rotate keys
    - The agent lacks privileges; the prompt cannot grant new ones to it
    - The user misuses the agent; the prompt cannot tell users apart
    - It uses its privileges for injected text; the prompt is a finite prior a strong injection beats
