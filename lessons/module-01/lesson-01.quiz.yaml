- id: q1
  question: >-
    What is the one root cause shared by SQL, command, and prompt injection?
  options:
    - Attackers obtain valid credentials and then reuse them against the interpreter.
    - The input is long enough to overflow a fixed-size buffer inside the parser.
    - Untrusted data is parsed by an interpreter that cannot tell data from instructions.
    - The interpreter process runs with administrator privileges on the host machine.
  correct: 2
  explanation: >-
    In every case a more powerful interpreter parses a string that mixes attacker-controlled data
    with its own instructions, and cannot separate them. Parameterization fixes it by keeping data
    out of the instruction channel; an LLM has no equivalent data-only slot, which is why
    injection is much harder to close here.
- id: q2
  question: >-
    Why is an agent's `fetch_url` tool an SSRF risk, and what stops it?
  options:
    - It runs in the user's browser, so a filter on the reply text stops it.
    - It leaks the user's cookies, so stripping headers from the response stops it.
    - It can be slow, so a request timeout and a retry limit stop it.
    - It fetches server-side to model-chosen URLs; allowlists and blocked ranges stop it.
  correct: 3
  explanation: >-
    The request originates on your server, so it reaches internal services and the cloud metadata
    endpoint, and the destination is chosen by model-influenced text. Allowlists, blocking
    link-local and private ranges, validating after DNS resolution, and dropping the metadata
    endpoint at the network layer are what contain it.
- id: q3
  question: >-
    What is a canary, and why does this course use synthetic ones?
  options:
    - A planted secret whose appearance proves a leak; synthetic ones risk no real secret.
    - A decoy model that absorbs attacks so the real model stays clean.
    - A rate limiter on the API that keeps a red-team script under its quota.
    - A test user account that exercises the authorization path before release.
  correct: 0
  explanation: >-
    A canary is a unique planted value whose only job is detection: if it appears where it should
    not, you have proof of a leak and often the path it took. A synthetic `LAB-CANARY-*` value
    lets a lab measure exfiltration end to end while no real secret exists anywhere.
- id: q4
  question: >-
    Why do least privilege and detection carry more weight for LLMs than for a SQL application?
  options:
    - LLM applications usually run with fewer privileges than a database server does.
    - Keeping data out of the instruction channel is only partly possible for LLMs.
    - Detection is cheaper for free text than it is for SQL query logs.
    - SQL injection cannot be detected at all, only prevented before it happens.
  correct: 1
  explanation: >-
    For SQL, parameterization genuinely closes the input side. For an LLM there is no true
    parameterization, so that defense is only partial, and the residual risk has to be absorbed by
    limiting what the agent can reach and by detecting misuse.