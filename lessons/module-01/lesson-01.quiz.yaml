  question: What is a canary, and why does this course use synthetic ones?
  options:
    - A planted secret that proves a leak; synthetic ones measure exfiltration with no real secret at risk
    - A decoy model that absorbs attacks; synthetic ones are cheaper to run than real models
    - A rate limiter on the API; synthetic ones avoid hitting real provider quotas
    - A test user account; synthetic ones avoid creating accounts on real services
  correct: 0
