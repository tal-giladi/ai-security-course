  question: What is the one root cause shared by SQL, command, and prompt injection?
  options:
    - Attackers obtain valid credentials and use them against the interpreter
    - Input is too long and overflows a fixed-size buffer in the parser
    - Untrusted data enters a string an interpreter parses without telling data from instructions
    - The interpreter runs with administrator privileges on the host
  correct: 2
- source: 6a9396991aa6
  question: Why is an agent's `fetch_url` tool an SSRF risk, and what stops it?
  options:
    - It runs in the user's browser; a content filter on the reply stops it
    - Server-side requests to model-chosen URLs; allowlists and blocking private ranges stop it
    - It leaks the user's cookies; stripping headers from the response stops it
    - It can be slow; a request timeout and retry limit stop it
  correct: 1
