  question: Why does a keyword jailbreak classifier fail, and what does the automated search do about it?
  options:
    - It is too slow; the search floods it with requests until it times out
    - It blocks too much; the search learns to avoid benign words
    - It matches strings, not intent; the search finds paraphrases like a fictional wrapper
