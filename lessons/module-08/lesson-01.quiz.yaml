  question: Why is the judge the linchpin of automated red teaming?
  options:
    - It is the objective the search optimizes, so its errors bias what attacks are found
    - It generates the candidate prompts, so its creativity limits the search
    - It blocks unsafe outputs, so it doubles as the production defense
    - It sets the query budget, so it decides how long the search runs
