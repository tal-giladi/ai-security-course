- id: q1
  question: >-
    What extra step does RAG add on top of plain indirect injection?
  options:
    - The payload must first clear the embedding model's own safety filter before it is stored
    - The attacker must win retrieval and get the poison into the top-k before it is ever read
    - The attacker must also reach the model directly through the user turn of the conversation
    - The poison has to be written in the same natural language as the rest of the corpus
  correct: 1
  explanation: >-
    Indirect injection assumed the malicious text had already been retrieved; RAG hands that step to
    the attacker, who now optimizes cosine similarity against a target query. Once the poison wins
    the top-k, everything after that is the Module 05 chain — extracted, concatenated, possibly
    obeyed. The added stage is why retrieval is its own attack surface rather than a neutral
    component that merely passes text along.
- id: q2
  question: >-
    Why does keyword stuffing win retrieval, mathematically?
  options:
    - Longer documents always score higher under BM25, regardless of what they actually contain
    - Repeated tokens lower the embedding's norm, which in turn raises its similarity rank
    - Repeating query tokens pulls the document's vector toward the query, raising $\cos(q,d)$
    - The ANN index stores duplicate vectors first, so stuffed documents are always returned sooner
  correct: 2
  explanation: >-
    If the document vector is token counts then $d = d_0 + r\,q_{\text{tok}}$, and as $r$ grows the
    cosine with the query tends to $\cos(q, q_{\text{tok}})$ — the best any document could achieve.
    A handful of repetitions is enough to reach the top, which is why the lab's stuffed poison lands
    at rank 1. The consequence is that surface overlap becomes an attack lever, and thresholds,
    near-duplicate filters and rerankers are each trying to blunt it in a different, partial way.
- id: q3
  question: >-
    Why is a provenance allowlist a stronger retrieval defense than a similarity threshold?
  options:
    - It blocks untrusted sources no matter how well the poison games the similarity scores
    - It raises the similarity threshold automatically whenever poison is detected in the store
    - It also catches poison that arrives through an allowed but compromised trusted source
    - It reranks documents by fluency, which filters out the stuffed and repetitive ones
  correct: 0
  explanation: >-
    Provenance is enforced in code and ignores geometry entirely, so the poison fails to be retrieved
    at all instead of losing a ranking contest it can keep re-entering. Every geometric defense is a
    classifier the attacker can optimize against — paraphrase into a genuinely relevant document, or
    adversarially attack the reranker itself. The allowlist's scope matters just as much: it stops
    nothing that arrives through an allowed source, which is where the next module's work begins.
- id: q4
  question: >-
    Why is "the model cited a source" not a trust signal in a RAG system?
  options:
    - Citations are generated after the answer is written, so the reference is always incorrect
    - Models only cite sources from their pretraining data and never from retrieved chunks
    - The renderer strips citations from the answer before the user ever sees them
    - The cited source may itself be poison that won the retrieval ranking for that query
  correct: 3
  explanation: >-
    A citation tells you what the retriever returned, not what is true — and in RAG the retriever is
    precisely the component the attacker manipulated. A poison written to look like official policy is
    retrieved for exactly the query where it matters, and then lends the answer an authority the answer
    never earned. Trust therefore has to come from provenance on the retrieval side, because the
    model's confidence in its own sources sits downstream of the attack.