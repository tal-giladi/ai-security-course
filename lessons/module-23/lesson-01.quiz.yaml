- id: q1
  question: >-
    What distinguishes an enforced control from a probabilistic one?
  options:
    - Enforced controls run in the model's inference engine; probabilistic ones run outside it
    - Enforced controls are deterministic and complete for their scope; probabilistic ones have false negatives and false positives
    - Enforced controls are configured per tenant; probabilistic ones are global
    - Enforced controls never need maintenance; probabilistic ones are retrained each quarter
  correct: 1
  explanation: >-
    The distinction is about the guarantee, not the technology. An output scrubber, an egress
    allowlist or an authorization check is ordinary code: within the scope it covers it is complete,
    so it holds even when the model is fully compromised. A classifier is a probabilistic decision
    with both error rates, so an attacker can work on the false negatives and users feel the false
    positives. Both can be implemented in the same language and the same process.
- id: q2
  question: >-
    A detector has 90% recall and a 5% false-positive rate, and attacks occur in 0.5% of
    requests. Roughly what share of its alerts are real?
  options:
    - About 90%
    - About 50%
    - About 8%
    - About 5%
  correct: 2
  explanation: >-
    Substituting into $\text{PPV}=\frac{t\pi}{t\pi+f(1-\pi)}$ gives
    $\frac{0.9\cdot0.005}{0.9\cdot0.005+0.05\cdot0.995}\approx 0.083$, so roughly 8%. The false
    positives outnumber the true positives about eleven to one, which is the arithmetic behind the
    rule that such a detector should alert and triage rather than block, while the enforced
    controls do the blocking.
- id: q3
  question: >-
    Why prefer one enforced control over stacking three probabilistic filters on the same hop?
  options:
    - The enforced control makes that hop's success probability zero, while the filters leave a positive residual
    - Filters are slower, so the enforced control is cheaper to run
    - Filters can only be applied to outputs, never to inputs
    - Stacking filters requires retraining the model
  correct: 0
  explanation: >-
    Three filters at pass-through rates $q_i$ compose to $\prod_i q_i$, which shrinks but never
    reaches zero, so some fraction of attacks always survives. One enforced control sets the factor
    to 0 and breaks the chain outright. The filters are not worthless — they add depth where no
    enforced control exists — but their false positives compound, so stacking them has a cost of its
    own.
- id: q4
  question: >-
    Your pipeline has a secret scrubber, an egress allowlist and an anomaly detector. Which
    statement about the composition is correct?
  options:
    - The detector's recall is the main determinant of overall attack success rate
    - Adding the detector strictly reduces risk, because a lower attack rate can never cost anything
    - The three controls are independent, so their residual rates simply add
    - The scrubber and the allowlist cover their scopes completely, so only unscoped attacks matter
  correct: 3
  explanation: >-
    Within its scope each enforced control holds, so what survives is the set of attacks lying
    outside every scope — allowlisted destinations, within-privilege misuse, and detector-evading
    variants. That residual is what the audit log and incident response exist for. The detector adds
    detection and forensics rather than prevention, and its false positives cost real users, so
    "add another layer" is not automatically a strict improvement.
