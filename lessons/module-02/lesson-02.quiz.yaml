  question: Which is a security pitfall unique to streaming, with its fix?
  options:
    - Streams use more tokens; fix it by lowering the max-token limit
    - Streams expose the system prompt; fix it by moving it to the user role
    - Acting on partial output before the filter decides; fix it by buffering until it does
    - Streams skip the tool schema; fix it by switching to JSON mode
