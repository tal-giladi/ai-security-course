  question: What does JSON mode guarantee, and what does it not?
  options:
    - It guarantees safe values, but not that the output parses as JSON
    - It guarantees parseable JSON of the given shape, but not safe or true values
    - It guarantees injection-free output, but not a particular field order
    - It guarantees both valid syntax and that values have been authorized
