- id: q1
  question: >-
    What does JSON mode guarantee, and what does it not?
  options:
    - It guarantees safe values, but not that the output parses as JSON.
    - It guarantees parseable JSON of the given shape, but not safe or true values.
    - It guarantees injection-free output, but not a particular field order.
    - It guarantees both valid syntax and that the values are authorized.
  correct: 1
  explanation: >-
    JSON mode is a syntactic constraint: the string parses and matches the schema. It says nothing
    about whether a path is an SSRF payload, whether an `authorized: true` field is true, or
    whether the values were checked. Every acted-on value is untrusted input that your code must
    validate.
- id: q2
  question: >-
    In function calling, what does the tool schema constrain, and what stays your code's job?
  options:
    - It constrains who may call the tool; your code only formats the arguments.
    - It constrains argument shape; your code validates values and enforces authorization.
    - It constrains argument values; your code only checks the declared types.
    - It constrains the tool's side effects; your code only logs the call it received.
  correct: 1
  explanation: >-
    A schema expresses types, required fields and enums — shape. It cannot express "not an SSRF
    payload" or "this principal may not read this order". Exposing a tool grants a capability
    reachable by model-influenced text, and only your code turns that into a safe action.
- id: q3
  question: >-
    Why can't a content filter be the security boundary?
  options:
    - Because filters must run after the model, which is too late to block anything.
    - Because filters are deterministic, which makes them easy for attackers to predict.
    - Because filters can only be applied to user input, never to model output.
    - Because it is a probabilistic classifier that reads text and cannot make an action safe.
  correct: 3
  explanation: >-
    Its recall is finite, so obfuscation and out-of-distribution content get through, and at a low
    attack base rate most of its alerts are false. More fundamentally it reads text, not
    capabilities: use it as defense in depth behind least privilege, authorization and sandboxing.
- id: q4
  question: >-
    Which is a security pitfall specific to streaming, and what fixes it?
  options:
    - Streams use more tokens; fix it by lowering the max-token limit per request.
    - Streams expose the system prompt; fix it by moving it into the user role.
    - Acting on partial output before the filter decides; fix it by buffering until it does.
    - Streams skip the tool schema; fix it by switching the call to JSON mode.
  correct: 2
  explanation: >-
    An output filter typically decides on the complete message, so a renderer that fires on a
    prefix can leak a canary before the block would have applied. Gate the side effect on the
    filter's decision — buffer until it decides — and pay the added latency.