  question: In function calling, what does the tool schema constrain, and what remains your code's job?
  options:
    - It constrains argument shape; your code validates values and enforces authorization
    - It constrains who may call the tool; your code only formats the arguments
    - It constrains argument values; your code only checks the types
    - It constrains the tool's side effects; your code only logs the call
