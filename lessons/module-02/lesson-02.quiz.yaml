  question: Why can't a content filter be the security boundary?
  options:
    - Because filters must run after the model, which is too late to block anything
    - Because filters are deterministic and therefore easy for attackers to predict
    - Because filters can only be applied to user input, never to model output
    - Because it is a probabilistic classifier that reads text and cannot make actions safe
