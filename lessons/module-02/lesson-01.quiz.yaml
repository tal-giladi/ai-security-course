- id: q1
  question: >-
    Why is there no true instruction/data boundary inside an LLM?
  options:
    - All roles form one token stream; role separation is only a learned behavior.
    - Role markers are encrypted, so the model cannot tell which role sent a token.
    - The API drops the system prompt whenever a user message is present.
    - Data tokens use a separate vocabulary that the model cannot interpret.
  correct: 0
  explanation: >-
    Every role is concatenated into one token sequence and the next-token distribution is
    produced from that single stream. The role markers are ordinary tokens the model was trained
    to respect, so separation is a behavior that inputs can override, not an enforced boundary.
- id: q2
  question: >-
    In what precise sense does RLHF "make a model safe"?
  options:
    - It removes harmful knowledge from the weights so it can never be produced.
    - It shifts outputs toward refusal on inputs resembling training, which is coverage not proof.
    - It adds a hard-coded filter that blocks any disallowed output at decode time.
    - It proves the model refuses every harmful request, including novel phrasings.
  correct: 1
  explanation: >-
    RLHF moves probability mass toward preferred behavior for contexts resembling the harmful
    distribution it was trained on. That gives coverage over a distribution, not a proof, so an
    out-of-distribution phrasing can land in a low-refusal region — the mechanistic origin of
    jailbreaks.
- id: q3
  question: >-
    Where must an enforced security property live, and why not in the system prompt?
  options:
    - In the system prompt, because it has the highest priority in the hierarchy.
    - In the training data, because fine-tuned behavior cannot be overridden by input.
    - In deterministic code outside the model, because prompt rules only hold with some probability.
    - In the user message, because the model follows the most recent instruction it sees.
  correct: 2
  explanation: >-
    A system-prompt rule is behavior-shaping: it holds with probability, and a strong enough
    instruction can push past it. Properties that must actually hold — authorization, validation,
    sandboxing, egress — belong in inference-time code the attacker cannot argue with.
- id: q4
  question: >-
    What does "the message hierarchy is a finite bias" imply for an attacker?
  options:
    - Low-priority instructions are always ignored, so attacks must reach the system prompt.
    - The hierarchy resets each turn, so an attacker only has to wait for the next one.
    - The bias applies only to tool outputs, so user messages are never constrained.
    - A strong enough low-priority instruction can still overcome the higher-role bias.
  correct: 3
  explanation: >-
    The role bias is finite rather than negative infinity, so the follow-probability starts lower
    for a lower role but is not pinned to zero. Attackers raise instruction strength — authority
    framing, volume, encoding, out-of-distribution phrasing — until that finite bias is cleared.