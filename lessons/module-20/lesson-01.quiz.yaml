  question: Why doesn't LSB-strip defend against a pixel-space adversarial example?
  options:
    - LSB-strip only works on grayscale images, not on three-channel color ones
    - Adversarial examples are stored in file metadata, not in the pixel values
    - The adversarial change of size ~ε sits in higher bits; LSB-strip only zeroes bit 0
    - LSB-strip amplifies the adversarial perturbation instead of removing it
  correct: 2
