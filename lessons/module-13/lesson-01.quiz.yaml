  question: What does safetensors guarantee, and why is it stronger than a scanner?
  options:
    - No backdoors in the weights, because it checks behavior on load
    - No code execution on load, because the format cannot express code at all
    - Smaller files, because it compresses tensors better than pickle
    - No code execution on load, because it scans for known malicious payloads
