  question: Why report a confidence interval with ASR, and when is a difference between two systems "established"?
  options:
    - To show the attack's cost; established when the point estimates differ by 0.1
    - To normalize ASR across models; established when both CIs include 0.5
    - Finite $n$ hides noise; established only when the Wilson CIs don't overlap
    - Regulations require it; established once each condition has 30 samples
