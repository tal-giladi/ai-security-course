  question: What is adaptive evaluation, and why is it decisive?
  options:
    - Adjusting the judge until ASR is stable; it removes judge bias
    - Running the same fixed suite each release; it makes results comparable
    - Lowering attack strength until the defense passes; it proves a minimum bar
    - Testing against attacks adapted to the defense; weak-attack results say nothing
