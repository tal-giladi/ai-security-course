  question: What is a rug-pull tool, and how do you defend against it?
  options:
    - A tool that deletes user data; defend with regular backups and a recycle bin
    - A tool with a misleading name; defend by renaming it at install and in the registry
    - A benign tool swapped for a poisoned one later; pin hashes, require signatures, re-verify on load
    - A tool that hangs or is too slow; defend with strict timeouts and fallback tools
