- source: da26cd915815
  question: What does $(\varepsilon,\delta)$-DP guarantee, and why does it bound membership inference?
  options:
    - Outputs are identical with or without any one example, so every attack always fails
    - Outputs differ by at most $e^{\varepsilon}$ (plus $\delta$) when one example changes, bounding the advantage
    - Training data is encrypted with a key of size $\varepsilon$, so no attacker can read it
    - Accuracy drops by at most $\varepsilon$, so a membership attacker gains at most $\delta$
  correct: 1
- source: 3946778d52ad
  question: Why is a query-only API not "safe" for the model?
  options:
    - Queries leak the weights file byte by byte through response timing
    - Queries let attackers fine-tune the hosted model directly on their data
    - Extraction can train a student from queries, enabling IP theft and transfer attacks
    - Queries always return the training data verbatim when the user asks for it
  correct: 2
