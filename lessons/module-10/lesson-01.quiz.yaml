  question: How does CW differ from PGD, and why does it find smaller perturbations?
  options:
    - CW uses a larger fixed $\epsilon$ and runs more gradient steps than PGD does
    - CW takes a single signed-gradient step, which moves less than PGD's many steps
    - CW minimizes perturbation norm subject to misclassification instead of maxing loss in a fixed ball
    - CW adds random noise before each step, which averages out and shrinks the perturbation
  correct: 2
