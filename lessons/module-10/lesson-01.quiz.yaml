  question: Why are transfer attacks a threat to black-box models?
  options:
    - Adversarials from a similar surrogate often fool the hidden target too
    - Black-box APIs leak their gradients through confidence scores
    - Transfer attacks steal the target's weights before attacking
    - Black-box models are always trained on public data the attacker controls
