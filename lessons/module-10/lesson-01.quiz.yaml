  question: What does the randomized-smoothing certificate guarantee?
  options:
    - Robustness to any $\ell_\infty$ attack of any size, with no loss in clean accuracy
    - Robustness to PGD specifically, but only within the budget $\epsilon$ used in training
    - That the base classifier never misclassifies Gaussian-noised copies of the input
    - Unchanged prediction for every $\ell_2$ perturbation smaller than $R=\sigma\Phi^{-1}(\underline{p_A})$
